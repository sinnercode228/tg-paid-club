# The app (bot, web app, scheduler and outbox in one process) with PostgreSQL.
#   cp .env.example .env    # set PAIDCLUB_BOT_TOKEN, PAIDCLUB_OWNER_ID, PAIDCLUB_CLUB_CHAT_IDS
#   docker compose up --build
# The web app is published on 127.0.0.1:8000 only; put an HTTPS reverse proxy in front of it
# for YooKassa notifications, the Telegram webhook mode and the /admin login.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paidclub
      POSTGRES_USER: paidclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paidclub}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paidclub -d paidclub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: [{ path: .env, required: false }]
    environment:
      PAIDCLUB_DATABASE_URL: postgresql+asyncpg://paidclub:${POSTGRES_PASSWORD:-paidclub}@db:5432/paidclub
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    # Exits non-zero when a part fails (a rejected token, the database gone): start it again.
    restart: unless-stopped
    stop_grace_period: 40s

volumes:
  db-data:
