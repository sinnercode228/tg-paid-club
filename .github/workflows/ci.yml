name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: Tests on SQLite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term
      - name: The example settings are valid
        run: cp .env.example .env && PAIDCLUB_BOT_TOKEN=123456:ci-token paidclub check

  postgres:
    # Claims use SELECT ... FOR UPDATE SKIP LOCKED and inserts use ON CONFLICT on PostgreSQL;
    # this job runs the database tests on a real server.
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paidclub
          POSTGRES_PASSWORD: paidclub
          POSTGRES_DB: paidclub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paidclub -d paidclub_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PAIDCLUB_TEST_DATABASE_URL: postgresql+asyncpg://paidclub:paidclub@localhost:5432/paidclub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tg-paid-club:ci .
      - name: The image runs as a non-root user and knows its commands
        run: |
          test "$(docker run --rm --entrypoint id tg-paid-club:ci -u)" != "0"
          docker run --rm tg-paid-club:ci paidclub --help
