[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tg-paid-club"
version = "0.1.0"
description = "Paid Telegram club: recurring subscriptions, join-request access control, renewal reminders, dunning and revenue stats (aiogram, FastAPI, SQLAlchemy)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "sinnercode228" }]
keywords = ["telegram", "aiogram", "subscriptions", "yookassa", "telegram-stars", "fastapi"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiogram>=3.31,<4",
  "aiogram-stars>=0.2.0,<0.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
  "asyncpg>=0.30",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
paidclub = "paidclub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paidclub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["paidclub"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "C4"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF001", # Cyrillic text in strings is intentional (member-facing copy is Russian)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["paidclub"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
